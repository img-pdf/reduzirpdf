    <script>
      (function() {
        var redirect = window.location.search.match(/[?&]p=([^&]+)/);
        if (redirect) {
          var newPath = '/' + decodeURIComponent(redirect[1]);
          var query = window.location.search.match(/[?&]q=([^&]+)/);
          var newQuery = query ? '?' + decodeURIComponent(query[1]) : '';
          window.history.replaceState(null, null, newPath + newQuery + window.location.hash);
        }
      })();
    </script>
