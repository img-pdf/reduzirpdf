      (function() {
        // Intercepta e neutraliza erros de extensões de terceiros (ex: Urban VPN / requests.js)

          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (
            event.reason &&
            typeof event.reason.stack === 'string' &&
            (event.reason.stack.includes('chrome-extension://') || event.reason.stack.includes('Cannot set property fetch of'))
          ) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        var prevOnError = window.onerror;
        window.onerror = function(msg, url, lineNo, columnNo, error) {
          if (
            (typeof url === 'string' && url.includes('chrome-extension://')) ||
            (error && error.stack && error.stack.includes('chrome-extension://')) ||
            (typeof msg === 'string' && (msg.includes('Cannot set property fetch of') || msg.includes('chrome-extension://')))
          ) {
            return true;
          }
          if (typeof prevOnError === 'function') {
            return prevOnError.apply(this, arguments);
          }
          return false;
        };

        // Garante que window.fetch e Window.prototype.fetch tenham getter e setter configurados
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          if (originalFetch) {
            var _f = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _f; },
                set: function(val) { _f = val; },
                configurable: true,
                enumerable: true
              });
            } catch (e1) {}

            if (typeof Window !== 'undefined' && Window.prototype) {
              try {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _f; },
                  set: function(val) { _f = val; },
                  configurable: true,
                  enumerable: true
                });
              } catch (e2) {}
            }
          }
        } catch (err) {}
      })();

      (function() {
        var redirect = window.location.search.match(/[?&]p=([^&]+)/);
        if (redirect) {
          var newPath = '/' + decodeURIComponent(redirect[1]);
          var query = window.location.search.match(/[?&]q=([^&]+)/);
          var newQuery = query ? '?' + decodeURIComponent(query[1]) : '';
          window.history.replaceState(null, null, newPath + newQuery + window.location.hash);
        }
      })();
